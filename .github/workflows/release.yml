# Builds both installers. Runs when a tag like v0.5.0-beta is pushed (and attaches the files to that release),
# or by hand: Actions -> "Build installers" -> Run workflow (files then appear under the run's Artifacts).
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Setup.exe
        shell: cmd
        run: installer\windows\build.bat ci
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: installer/windows/Output/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/windows/Output/*.exe
          prerelease: ${{ contains(github.ref_name, 'beta') }}

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage
        run: bash installer/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: installer/linux/Output/*.AppImage
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/linux/Output/*.AppImage
          prerelease: ${{ contains(github.ref_name, 'beta') }}
